<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{title}}</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			line-height: 1.7;
			max-width: 860px;
			margin: 0 auto;
			padding: 2rem 1.5rem;
			color: #333;
		}

		pre {
			padding: 0;
		}

		code {
			font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
			border: 1px solid #0002;
			border-radius: 3px;
			background: #f6f8fa;
			padding: 1px;
		}

		pre code {
			display: block;
			border: 0;
			padding: 1rem;
			border-radius: 6px;
			overflow-x: auto;
		}

		aside.callout {
			background: #eef6fc;
			border-left: 4px solid #209cee;
			padding: 1rem 1.25rem;
			margin: 1.25rem 0;
			border-radius: 0 4px 4px 0;
		}

		aside.note {
			background: #fffdf5;
			border-left: 4px solid #ffdd57;
			padding: 1rem 1.25rem;
			margin: 1.25rem 0;
			border-radius: 0 4px 4px 0;
		}

		table {
			border-collapse: collapse;
			width: 100%;
			margin: 1.25rem 0;
		}

		th,
		td {
			border: 1px solid #dbdbdb;
			padding: 0.6em 0.8em;
		}

		th {
			background: #fbfbfb;
		}
	</style>
</head>

<body>
	{{content}}
</body>

</html>
